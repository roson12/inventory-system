name: inventory

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ims}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ims} -d ${POSTGRES_DB:-ims}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ims}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ims}?schema=public
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - internal

  # Optional: Cloudflare Tunnel. Start with: docker compose --profile tunnel up -d
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env. No inbound ports are opened.
  cloudflared:
    image: cloudflare/cloudflared:2025.1.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal

  # Optional: Playwright smoke tests. Start with:
  #   docker compose --profile e2e run --rm e2e
  # Requires the seeded demo accounts.
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    profiles: ["e2e"]
    working_dir: /work/apps/web
    volumes:
      - .:/work
    environment:
      BASE_URL: http://web
      CI: "true"
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres-data:
  uploads-data:

networks:
  internal:
    driver: bridge
